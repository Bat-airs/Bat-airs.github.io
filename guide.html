<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理工具说明 · Bat airs 博客</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --card: #fff; --text: #1f2937; --muted: #6b7280;
    --accent: #0d9488; --border: #e5e7eb; --dark: #0f172a;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #2dd4bf; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.8;
    transition: background .2s, color .2s;
  }
  header {
    background: var(--dark); color: #fff; position: sticky; top: 0; z-index: 10;
  }
  header .inner {
    max-width: 860px; margin: 0 auto; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header a { color: #cbd5e1; text-decoration: none; margin-left: 18px; font-size: 14px; }
  header a:hover { color: #5eead4; }
  .brand { color: #fff; font-weight: 700; font-size: 18px; margin-left: 0; }
  main {
    max-width: 860px; margin: 0 auto; padding: 32px 24px 48px;
  }
  #loading { color: var(--muted); text-align: center; padding: 80px 0; }
  footer {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 24px; border-top: 1px solid var(--border);
  }
  /* 渲染后的 Markdown 样式 */
  #content h1 { font-size: 28px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin: 0 0 24px; }
  #content h2 { font-size: 21px; margin: 34px 0 12px; padding-left: 10px; border-left: 4px solid var(--accent); }
  #content h3 { font-size: 17px; margin: 24px 0 10px; }
  #content p { margin: 12px 0; }
  #content a { color: var(--accent); }
  #content ul, #content ol { margin: 12px 0 12px 26px; }
  #content li { margin: 5px 0; }
  #content code {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; font-size: 13px;
  }
  #content pre {
    background: var(--dark); color: #e2e8f0; border-radius: 10px;
    padding: 16px; overflow: auto; margin: 14px 0; font-size: 13px; line-height: 1.6;
  }
  #content pre code { background: none; border: none; padding: 0; color: inherit; }
  #content blockquote {
    border-left: 3px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 14px 0;
  }
  #content table { border-collapse: collapse; width: 100%; margin: 14px 0; }
  #content th, #content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  #content th { background: var(--card); }
  #content img { max-width: 100%; border-radius: 10px; }
  .theme-btn {
    background: none; border: 1px solid rgba(255,255,255,.25); color: #fff;
    border-radius: 8px; padding: 3px 10px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <a class="brand" href="https://bat-airs.github.io/">Bat airs</a>
    <nav>
      <a href="https://bat-airs.github.io/">首页</a>
      <a href="https://bat-airs.github.io/blog/">博客</a>
      <a href="https://bat-airs.github.io/about/">关于</a>
      <button class="theme-btn" id="themeBtn" aria-label="切换深色模式">🌙</button>
    </nav>
  </div>
</header>

<main>
  <div id="loading">加载工具说明中…</div>
  <div id="content" hidden></div>
</main>

<footer>© Bat airs · 由 Jekyll 驱动 · 托管于 GitHub Pages</footer>

<script>
  const MD_URL = "https://raw.githubusercontent.com/Bat-airs/Bat-airs.github.io/main/docs/guide.md";

  fetch(MD_URL)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(md => {
      document.getElementById("loading").hidden = true;
      const c = document.getElementById("content");
      c.innerHTML = marked.parse(md);
      c.hidden = false;
    })
    .catch(e => {
      document.getElementById("loading").innerHTML =
        "加载失败（" + e.message + "）。<br>可以直接查看原始文件：" +
        '<a href="' + MD_URL + '" target="_blank" rel="noopener">docs/guide.md</a>';
    });

  // 深色模式（与博客一致）
  (function () {
    const KEY = "bat-airs-theme";
    const btn = document.getElementById("themeBtn");
    function apply(t) {
      document.documentElement.setAttribute("data-theme", t);
      if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
    }
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    apply(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    if (btn) btn.onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    };
  })();
</script>
</body>
</html>
