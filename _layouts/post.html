---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.tags %} · {{ page.tags | join: " / " }}{% endif %}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back"><a href="/blog.html">← 返回文章列表</a></p>
</article>
